<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARD GUYS — Monster TCG Shop Sim</title>
<style>
:root{
  --bg:#161020; --panel:#221a30; --panel2:#2b2140; --line:#3d2f58;
  --ink:#efe6ff; --dim:#9c8cc0; --accent:#ffb347; --accent2:#7c5cff;
  --good:#5dd97c; --bad:#ff6b6b; --hype:#ff5da2;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 70% -10%, #2a1f42 0%, var(--bg) 60%);
  color:var(--ink); font:14px/1.45 "Segoe UI",system-ui,sans-serif; overflow:hidden;
}
button{font:inherit; color:inherit; background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; padding:6px 12px; cursor:pointer; transition:.15s}
button:hover{border-color:var(--accent); color:var(--accent)}
button:disabled{opacity:.4; cursor:not-allowed}
button.primary{background:linear-gradient(135deg,var(--accent2),#5a3fd6); border-color:#8f76ff; font-weight:600}
button.primary:hover{filter:brightness(1.15); color:#fff}
input,select{font:inherit; background:#1a1329; border:1px solid var(--line); color:var(--ink);
  border-radius:8px; padding:7px 10px; outline:none}
input:focus{border-color:var(--accent2)}
#topbar{position:relative; z-index:10; display:flex; align-items:center; gap:18px; padding:10px 16px;
  background:rgba(29,21,48,.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.logo{font-weight:800; letter-spacing:2px; font-size:18px;
  background:linear-gradient(90deg,var(--accent),#ff7b54); -webkit-background-clip:text; color:transparent}
#stats{display:flex; gap:16px; flex:1}
.stat{display:flex; align-items:center; gap:6px; background:#1a1329; padding:5px 12px; border-radius:20px;
  border:1px solid var(--line); font-weight:600; font-size:13px}
.stat b{color:var(--accent)}
#phaseTag{min-width:120px; text-align:center}
#speedctrl{display:flex; gap:6px}
#speedctrl button{padding:5px 10px}
#speedctrl button.on{border-color:var(--accent); color:var(--accent); background:#33254d}
main{display:block; height:calc(100% - 57px)}
#floor{pointer-events:none}
#floorHead{position:fixed; top:var(--topH,69px); left:12px; right:454px; z-index:5; display:flex; align-items:center; gap:14px; padding:10px 14px;
  border:1px solid var(--line); border-radius:12px; background:rgba(29,21,48,.88); backdrop-filter:blur(10px)}
#floorHead h2{font-size:15px; letter-spacing:1px; color:var(--dim)}
#progWrap{flex:1; height:8px; background:#17102a; border-radius:4px; overflow:hidden}
#prog{height:100%; width:0%; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .3s linear}
#openBtn{padding:8px 18px}
#shelves{position:fixed; left:12px; bottom:12px; right:454px; z-index:5; pointer-events:auto; padding:10px 14px 8px;
  display:flex; gap:10px; overflow-x:auto; min-height:186px; background:rgba(34,26,48,.85);
  border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(10px)}
#shelves:empty::after{content:"Empty shelves — ask ORACLE to design a set, then print it."; color:var(--dim); font-style:italic; padding:60px 20px}
.pcard{position:relative; width:120px; flex:0 0 auto; cursor:pointer; transition:.15s}
.pcard:hover{transform:translateY(-4px)}
.pcard img{width:120px; border-radius:10px; display:block; box-shadow:0 6px 18px rgba(0,0,0,.5)}
.pcard .stock{position:absolute; top:6px; right:6px; background:rgba(10,6,20,.85); border:1px solid var(--line);
  border-radius:6px; padding:2px 7px; font-size:12px; font-weight:700}
.pcard .stock.low{color:var(--bad); border-color:var(--bad)}
.pcard .price{position:absolute; bottom:6px; left:6px; right:6px; background:rgba(10,6,20,.85);
  border-radius:6px; padding:2px 7px; font-size:12px; font-weight:700; color:var(--accent); text-align:center}
.pcard.soldout img{filter:grayscale(.7) brightness(.6)}
#walkArea{position:fixed; inset:0; z-index:0; pointer-events:auto;
  background:linear-gradient(180deg,#241a38 0%, #1c1430 60%, #171028 100%); overflow:hidden}
#walkArea canvas{position:absolute; inset:0; display:block; touch-action:none; cursor:grab}
#walkArea canvas:active{cursor:grabbing}
.bubble3d{position:absolute; transform:translate(-50%,-100%); white-space:nowrap; z-index:3; pointer-events:none;
  background:#f4edff; color:#241a38; padding:5px 10px; border-radius:10px; font-size:12px; font-weight:600;
  box-shadow:0 3px 10px rgba(0,0,0,.4); animation:pop .25s}
.bubble3d::after{content:""; position:absolute; top:100%; left:50%; margin-left:-5px;
  border:5px solid transparent; border-top-color:#f4edff}
.viewbadge{position:absolute; bottom:212px; left:50%; transform:translateX(-50%); z-index:4; font-size:11px; font-weight:600;
  background:rgba(10,6,20,.72); border:1px solid var(--line); border-radius:6px; padding:3px 9px; color:var(--dim); pointer-events:none}
.customer{position:absolute; bottom:34px; width:96px; text-align:center; transition:left 2.2s ease, opacity .5s; z-index:2}
.customer canvas{width:84px; image-rendering:auto; animation:bob 1.4s ease-in-out infinite; filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bubble{position:absolute; bottom:100%; left:50%; transform:translateX(-50%); white-space:nowrap;
  background:#f4edff; color:#241a38; padding:5px 10px; border-radius:10px; font-size:12px; font-weight:600;
  box-shadow:0 3px 10px rgba(0,0,0,.4); margin-bottom:6px; animation:pop .25s}
.bubble::after{content:""; position:absolute; top:100%; left:50%; margin-left:-5px;
  border:5px solid transparent; border-top-color:#f4edff}
@keyframes pop{from{transform:translateX(-50%) scale(.5); opacity:0}}
.customer .mood{font-size:16px; position:absolute; top:-14px; right:2px}
#side{position:fixed; top:69px; right:12px; bottom:12px; width:430px; z-index:6; background:rgba(34,26,48,.9);
  border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; overflow:hidden; backdrop-filter:blur(10px)}
#tabs{display:flex; border-bottom:1px solid var(--line); background:#1d1530}
#tabs button{flex:1; border:none; border-radius:0; padding:11px 4px; background:transparent; color:var(--dim); font-weight:700; font-size:12.5px; letter-spacing:.5px}
#tabs button.on{color:var(--accent); background:#2b2140; box-shadow:inset 0 -3px 0 var(--accent)}
.tab{flex:1; display:none; flex-direction:column; overflow:hidden}
.tab.on{display:flex}
#chatLog{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px}
.msg{max-width:92%; padding:9px 12px; border-radius:12px; font-size:13px; white-space:pre-wrap}
.msg.oracle{align-self:flex-start; background:#2b2140; border:1px solid #443366; border-top-left-radius:3px}
.msg.oracle b{color:var(--accent2)}
.msg.me{align-self:flex-end; background:#3d2f58; border-top-right-radius:3px}
.msg .sys{display:block; margin-top:6px; padding:7px 9px; background:#1a1329; border-radius:8px; border-left:3px solid var(--accent2); color:var(--dim); font-size:12.5px}
#oracleHead{display:flex; align-items:center; gap:9px; padding:10px 14px; border-bottom:1px solid var(--line); background:#1d1530}
#oracleHead .orb{width:26px; height:26px; border-radius:50%; flex:0 0 auto;
  background:radial-gradient(circle at 35% 30%, #c9b8ff, var(--accent2) 55%, #2a1b66);
  box-shadow:0 0 14px var(--accent2); animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 10px var(--accent2)}50%{box-shadow:0 0 22px #a58fff}}
#oracleHead b{letter-spacing:1px}
#oracleHead small{color:var(--dim); display:block; font-size:11px}
#chatForm{display:flex; gap:8px; padding:10px; border-top:1px solid var(--line)}
#chatInput{flex:1}
#chips{display:flex; gap:6px; padding:0 10px 10px; flex-wrap:wrap}
.chip{font-size:11.5px; padding:4px 10px; border-radius:14px; background:#1a1329; border:1px solid var(--line); color:var(--dim); cursor:pointer}
.chip:hover{color:var(--accent); border-color:var(--accent)}
.tabpad{padding:12px; overflow-y:auto; flex:1}
.tabpad h3{font-size:13px; letter-spacing:1px; color:var(--dim); margin:14px 0 8px}
.tabpad h3:first-child{margin-top:0}
.invRow{display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--panel2); border:1px solid var(--line);
  border-radius:10px; padding:8px; margin-bottom:8px}
.invRow img{width:56px; border-radius:6px}
.invRow .info{flex:1; min-width:0}
.invRow .info b{display:block; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.invRow .info small{color:var(--dim); font-size:11px}
.invRow .pr{display:flex; align-items:center; gap:4px}
.invRow .pr input{width:58px; padding:4px 6px; text-align:center}
.invRow .pr button{padding:3px 8px}
.invRow .stk{width:44px; text-align:center; font-weight:700}
.eventCard{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px}
.eventCard h4{font-size:14px; margin-bottom:6px}
.eventCard p{color:var(--dim); font-size:12.5px; margin-bottom:8px}
.eventCard .row{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
.eventCard.locked{opacity:.55}
#ledger{flex:1; overflow-y:auto; padding:10px; font-size:12.5px}
#ledger div{padding:4px 6px; border-bottom:1px dashed #322550; color:var(--dim)}
#ledger div b{color:var(--ink)}
#ledger div.money b{color:var(--good)}
#ledger div.badm b{color:var(--bad)}
#modalBack{position:fixed; inset:0; background:rgba(8,4,18,.78); display:none; z-index:50;
  align-items:center; justify-content:center; backdrop-filter:blur(3px)}
#modalBack.on{display:flex}
#modal{background:var(--panel); border:1px solid var(--line); border-radius:16px; max-width:1080px; width:96%;
  max-height:88vh; overflow-y:auto; padding:20px}
#modal h2{margin-bottom:4px}
#modal .sub{color:var(--dim); margin-bottom:14px; font-size:13px}
#setGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin:12px 0}
#setGrid img{width:100%; max-height:205px; object-fit:contain; border-radius:10px; box-shadow:0 5px 14px rgba(0,0,0,.45)}
.modalBtns{display:flex; gap:10px; justify-content:flex-end; margin-top:14px}
.tlog{background:#17102a; border-radius:10px; padding:10px; margin:10px 0; font-size:12.5px; max-height:260px; overflow-y:auto}
.tlog div{padding:3px 0; color:var(--dim)}
.tlog div b{color:var(--ink)}
.tlog div.hl{color:var(--accent)}
.big{font-size:26px; font-weight:800; color:var(--accent)}
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:10px 0}
.statgrid .cell{background:#1a1329; border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center}
.statgrid .cell small{color:var(--dim); display:block}
::-webkit-scrollbar{width:9px; height:9px}
::-webkit-scrollbar-thumb{background:#3d2f58; border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
body.noui #side,body.noui #shelves,body.noui #floorHead{display:none}
@media (max-width:1150px){#side{width:min(430px,44vw)}#shelves,#floorHead{right:calc(min(430px,44vw) + 24px)}}
#intro{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(900px 500px at 50% 20%, #2a1f42 0%, #120c1e 70%); transition:opacity .6s}
#intro.off{opacity:0; pointer-events:none}
.introCard{text-align:center; padding:44px 64px; background:rgba(34,26,48,.78); border:1px solid var(--line);
  border-radius:20px; backdrop-filter:blur(8px); box-shadow:0 20px 60px rgba(0,0,0,.6)}
.introLogo{font-size:44px; font-weight:800; letter-spacing:4px;
  background:linear-gradient(90deg,var(--accent),#ff7b54); -webkit-background-clip:text; color:transparent; margin-bottom:10px}
.introCard p{color:var(--dim); margin-bottom:20px}
#enterBtn{font-size:18px; padding:12px 34px; letter-spacing:1px}
.introCard small{display:block; margin-top:16px; color:var(--dim)}
</style>
</head>
<body>
<header id="topbar">
  <div class="logo">🃏 CARD GUYS</div>
  <div id="stats">
    <div class="stat" id="phaseTag">🌅 Prep</div>
    <div class="stat">💵 <b id="cash">0</b></div>
    <div class="stat">⭐ Rep <b id="rep">0</b></div>
    <div class="stat">🔥 Hype <b id="hype">0</b></div>
    <div class="stat">🏪 Lv <b id="lvl">1</b></div>
  </div>
  <div id="speedctrl">
    <button id="sp0" title="Pause">⏸</button>
    <button id="sp1" class="on" title="Normal">▶</button>
    <button id="sp3" title="Fast">⏩</button>
    <button id="uiBtn" title="Hide/show panels">🖥️</button>
  </div>
</header>
<main>
  <section id="floor">
    <div id="floorHead">
      <h2>SHOP FLOOR</h2>
      <div id="progWrap"><div id="prog"></div></div>
      <button id="openBtn" class="primary">🔔 Open Shop</button>
    </div>
    <div id="shelves"></div>
    <div id="walkArea"></div>
  </section>
  <aside id="side">
    <nav id="tabs">
      <button data-tab="oracle" class="on">🔮 ORACLE</button>
      <button data-tab="inv">📦 Inventory</button>
      <button data-tab="events">🏆 Events</button>
      <button data-tab="build">🛠️ Build</button>
      <button data-tab="phone">📱 Phone</button>
      <button data-tab="ledger">📜 Ledger</button>
    </nav>
    <div id="tab-oracle" class="tab on">
      <div id="oracleHead"><div class="orb"></div><div><b>ORACLE</b><small>Shop Intelligence Engine v9.3 — online</small></div></div>
      <div id="chatLog"></div>
      <div id="chips"></div>
      <form id="chatForm"><input id="chatInput" placeholder="e.g. design a spooky deep-sea set..." autocomplete="off"><button class="primary">Send</button></form>
    </div>
    <div id="tab-inv" class="tab"><div class="tabpad" id="invList"></div></div>
    <div id="tab-events" class="tab"><div class="tabpad" id="eventsPad"></div></div>
    <div id="tab-build" class="tab"><div class="tabpad" id="buildPad"></div></div>
    <div id="tab-phone" class="tab"><div class="tabpad" id="phoneBody"></div></div>
    <div id="tab-ledger" class="tab"><div id="ledger"></div></div>
  </aside>
</main>
<div id="modalBack"><div id="modal"></div></div>
<div id="intro">
  <div class="introCard">
    <div class="introLogo">🃏 CARD GUYS</div>
    <p>Run the monster TCG shop — print cards &amp; figures, host tournaments and drops.</p>
    <button id="enterBtn" class="primary">🚪 ENTER SHOP</button>
    <small>drag to orbit · scroll to zoom · 🖥️ hides the panels</small>
  </div>
</div>
<script>
function loadThree(i){var urls=['https://unpkg.com/three@0.128.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'];if(i>=urls.length){window.__threeFailed=true;return}var s=document.createElement('script');s.src=urls[i];s.onerror=function(){loadThree(i+1)};document.head.appendChild(s)}
loadThree(0);
</script>
<script>
/*__JS_START__*/
'use strict';
// ============================== UTILS ==============================
const $=id=>document.getElementById(id);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry32((Math.random()*1e9)|0);
const pick=(r,arr)=>arr[(r()*arr.length)|0];
const ri=(r,a,b)=>a+((r()*(b-a+1))|0);
const rf=(r,a,b)=>a+r()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(r,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=(r()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}

// ============================== DATA ==============================
const PALETTES=[
 {n:'Ember',   b:'#ff7a45',d:'#a63312',l:'#ffd23f'},
 {n:'Tide',    b:'#3fa7ff',d:'#1b4f9e',l:'#a8e6ff'},
 {n:'Verdant', b:'#5dd97c',d:'#1f7a44',l:'#d4ff9e'},
 {n:'Storm',   b:'#b78bff',d:'#5b2fa8',l:'#e6d4ff'},
 {n:'Void',    b:'#8a5cff',d:'#31175e',l:'#d0baff'},
 {n:'Lumen',   b:'#ffe066',d:'#c98a12',l:'#fff7cc'},
 {n:'Terra',   b:'#d9a066',d:'#7a4a21',l:'#f0d9b8'},
 {n:'Frost',   b:'#9be8ff',d:'#2e7d9e',l:'#e8fbff'},
 {n:'Rose',    b:'#ff6b9e',d:'#a11d55',l:'#ffd4e4'},
 {n:'Moss',    b:'#a3c14a',d:'#5a6e1a',l:'#e4f2b0'},
 {n:'Ink',     b:'#7d8ca3',d:'#2c3648',l:'#cfd9ea'},
 {n:'Candy',   b:'#ff9de2',d:'#a13c8a',l:'#ffe0f7'},
];
const ELEMENTS=['Ember','Tide','Verdant','Storm','Void','Lumen','Terra','Frost'];
const TRIBES=['Beast','Golem','Sprite','Wraith','Drake','Slime','Kraken','Automaton'];
const RARITY=[{n:'Common',c:'#9aa0a6'},{n:'Uncommon',c:'#58c470'},{n:'Rare',c:'#4aa3ff'},{n:'Legendary',c:'#ffb020'}];
const NAME_A=['Gor','Vel','Zim','Thra','Mub','Kaz','Fen','Lum','Nyx','Bog','Quil','Dro','Sar','Umb','Wix','Yel','Zar','Omm','Pib','Ruk','Glim','Snor','Tum','Vra'];
const NAME_B=['blat','drix','fang','gob','lorn','mek','nix','phel','quob','rast','snar','tok','vex','wug','xem','yor','zle','kith','sur','mop','dangle','wisp','grub','puff'];
const NAME_C=['','ith','ax','or','us','ael','on','is','ar'];
const TITLES=['the Unblinking','of the Deep Vault','Dusk-Eater','the Very Round','First of Its Name','the Soggy','Coin-Hoarder','the Gently Menacing','of Nine Pockets','the Overstuffed','Late for Dinner','the Glittering','Wall-Chewer','the Suspiciously Cute','Keeper of Foils','the Triple-Rare','Shelf-Sitter Supreme','the Unpriced'];
const KEYWORDS={
 Guard:'soaks 2 damage aimed at your leader',
 Swift:'always strikes before slower monsters',
 Leech:'heals itself for half the damage it deals',
 Echo:'copies the last trick played this turn',
 Surge:'+2 ATK while you control another Storm monster',
 Veil:"can't be targeted the turn it arrives",
 Rally:'allies get +1 ATK when this arrives',
 Feast:'gains +1/+1 whenever a monster is munched',
 Hoard:'draw a extra card when it survives a turn',
 Slam:'deals its ATK to two targets instead of one',
};
const FLAVOR=['It was here before the shelves.','Do not feed after midnight. Or ever.','Smells faintly of fresh ink.','Collectors call it "the good one".','It judges your deck. Harshly.','Bred in captivity, priced in captivity.','The box lies. It does not fit back in.','Certified 100% monster.','Warning: may chew sleeves.','It dreams of being played.','Rumored to wink when you look away.','Sold as-is. Very is.'];
const ELEMENT_EMOJI={Ember:'🔥',Tide:'🌊',Verdant:'🌿',Storm:'⚡',Void:'🌌',Lumen:'✨',Terra:'⛰️',Frost:'❄️'};

// keyword -> element / tribe maps for ORACLE theme reading
const THEME_ELEM={fire:'Ember',flame:'Ember',ember:'Ember',lava:'Ember',volcano:'Ember',water:'Tide',ocean:'Tide',sea:'Tide',deep:'Tide',abyss:'Tide',reef:'Tide',plant:'Verdant',forest:'Verdant',jungle:'Verdant',mushroom:'Verdant',swamp:'Verdant',garden:'Verdant',storm:'Storm',thunder:'Storm',lightning:'Storm',wind:'Storm',sky:'Storm',void:'Void',spooky:'Void',ghost:'Void',dark:'Void',night:'Void',cursed:'Void',shadow:'Void',light:'Lumen',holy:'Lumen',shiny:'Lumen',radiant:'Lumen',celestial:'Lumen',earth:'Terra',rock:'Terra',mountain:'Terra',crystal:'Terra',desert:'Terra',ice:'Frost',frost:'Frost',snow:'Frost',winter:'Frost',arctic:'Frost'};
const THEME_TRIBE={dragon:'Drake',drake:'Drake',wyrm:'Drake',slime:'Slime',blob:'Slime',goo:'Slime',ghost:'Wraith',spirit:'Wraith',wraith:'Wraith',skeleton:'Wraith',robot:'Automaton',mech:'Automaton',automaton:'Automaton',clockwork:'Automaton',squid:'Kraken',kraken:'Kraken',octopus:'Kraken',tentacle:'Kraken',fairy:'Sprite',pixie:'Sprite',sprite:'Sprite',imp:'Sprite',beast:'Beast',wolf:'Beast',cat:'Beast',bear:'Beast',golem:'Golem',rock:'Golem',statue:'Golem'};

// ============================== CREATURE GEN ==============================
// Every creature is unique: seeded proportions, palette, parts, pattern, face.
function genCreature(seed,opts={}){
  const r=mulberry32(seed);
  const c={
    seed,
    bodyType:pick(r,['blob','tall','round','wide','blob','round']),
    pal:opts.pal||pick(r,PALETTES),
    element:opts.element||pick(r,ELEMENTS),
    tribe:opts.tribe||pick(r,TRIBES),
    eyes:pick(r,[1,2,2,2,3,4]),
    eyeStyle:pick(r,['round','round','sleepy','sharp','star','glow']),
    mouth:pick(r,['smile','smile','fang','oo','zig','w']),
    horns:r()<.55, hornStyle:pick(r,['spike','curved','antenna','crown']),
    wings:r()<.3, tail:r()<.55,
    pattern:pick(r,['none','none','spots','stripes','scales','stars']),
    ears:r()<.5, earStyle:pick(r,['pointy','round','fin']),
    belly:r()<.7, size:rf(r,.85,1.2),
    jit:Array.from({length:10},()=>rf(r,.82,1.16)),
    brow:r()<.4,
  };
  if(opts.traits)Object.assign(c,opts.traits);
  return c;
}
function genName(r,tribe){
  const base=pick(r,NAME_A)+pick(r,NAME_B)+pick(r,NAME_C);
  return r()<.55? base+' '+pick(r,TITLES) : base;
}

// ============================== DRAWING PRIMITIVES ==============================
function rr(ctx,x,y,w,h,rad){ctx.beginPath();ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath()}
function bodyPath(ctx,c,cx,cy,rx,ry){
  const n=c.jit.length;
  const pt=i=>{const a=(i/n)*Math.PI*2-Math.PI/2;const j=c.jit[i%n];return[cx+Math.cos(a)*rx*j,cy+Math.sin(a)*ry*j]};
  ctx.beginPath();
  const p0=pt(0),pn=pt(n-1);
  ctx.moveTo((p0[0]+pn[0])/2,(p0[1]+pn[1])/2);
  for(let i=0;i<=n;i++){const p1=pt(i%n),p2=pt((i+1)%n);ctx.quadraticCurveTo(p1[0],p1[1],(p1[0]+p2[0])/2,(p1[1]+p2[1])/2)}
  ctx.closePath();
}
function shade(hex,f){ // lighten f>0 / darken f<0
  const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r+255*f),0,255);g=clamp(Math.round(g+255*f),0,255);b=clamp(Math.round(b+255*f),0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function star(ctx,x,y,ro,ri2,n=5){ctx.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,rad=i%2?ri2:ro;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}ctx.closePath()}

// ============================== CREATURE RENDER ==============================
// opts: {fig:false} card mode = flat vivid; {fig:true} = glossy 3D-lit figurine
function drawBlocky(ctx,c,cx,cy,s,fig){
  const B=c.blocky||{skin:'#f5c531',shirt:'#2f6fd0',pants:'#4fae4f'};
  const lw=Math.max(1.5,s*.028);
  const legW=s*.2,legH=s*.5,legY=cy+s*.3;
  ctx.fillStyle=B.pants;
  ctx.fillRect(cx-legW*1.15,legY,legW,legH);ctx.fillRect(cx+legW*.15,legY,legW,legH);
  const torW=s*.72,torH=s*.62,torY=cy-s*.32;
  ctx.fillStyle=B.shirt;ctx.fillRect(cx-torW/2,torY,torW,torH);
  const armW=s*.17,armH=s*.58;
  ctx.fillStyle=B.skin;
  ctx.fillRect(cx-torW/2-armW*1.15,torY+s*.05,armW,armH);
  ctx.fillRect(cx+torW/2+armW*.15,torY+s*.05,armW,armH);
  const hs=s*.6,hy=torY-hs*1.04;
  ctx.fillStyle=B.skin;ctx.fillRect(cx-hs/2,hy,hs,hs);
  if(B.hair){ctx.fillStyle=B.hair;ctx.fillRect(cx-hs/2,hy,hs,hs*.3)}
  if(B.hat){ctx.fillStyle=B.hat;ctx.fillRect(cx-hs*.56,hy-hs*.24,hs*1.12,hs*.22)}
  const ey=hy+hs*.44,ex=hs*.17,er=hs*.075;
  ctx.fillStyle='#1c1226';
  ctx.beginPath();ctx.ellipse(cx-ex,ey,er,er*1.6,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+ex,ey,er,er*1.6,0,0,7);ctx.fill();
  ctx.strokeStyle='#1c1226';ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.beginPath();
  if(c.mouth==='zig'){ctx.moveTo(cx-hs*.2,ey+hs*.26);for(let i=0;i<4;i++)ctx.lineTo(cx-hs*.2+(i+1)*hs*.1,ey+hs*.26+(i%2?hs*.06:-hs*.02))}
  else ctx.arc(cx,ey+hs*.16,hs*.17,.15*Math.PI,.85*Math.PI);
  ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=lw;
  ctx.strokeRect(cx-torW/2,torY,torW,torH);ctx.strokeRect(cx-hs/2,hy,hs,hs);
  ctx.strokeRect(cx-legW*1.15,legY,legW,legH);ctx.strokeRect(cx+legW*.15,legY,legW,legH);
  if(fig){const ao=ctx.createLinearGradient(0,hy,0,legY+legH);ao.addColorStop(0,'rgba(255,255,255,.12)');ao.addColorStop(1,'rgba(0,0,20,.3)');ctx.fillStyle=ao;ctx.fillRect(cx-torW/2-armW*1.2,hy,torW+armW*2.4,legY+legH-hy)}
}
function drawCreature(ctx,c,cx,cy,s,opts={}){
  const fig=!!opts.fig, r=mulberry32(c.seed^0x9e37);
  if(c.style==='blocky'){drawBlocky(ctx,c,cx,cy,s,fig);return}
  const rx=s*(c.bodyType==='tall'?.62:c.bodyType==='wide'?.95:c.bodyType==='round'?.72:.8)*c.size;
  const ry=s*(c.bodyType==='tall'?1.05:c.bodyType==='wide'?.62:c.bodyType==='round'?.72:.78)*c.size;
  const P=c.pal;
  // tail (behind)
  if(c.tail){ctx.strokeStyle=shade(P.d,-.05);ctx.lineWidth=s*.09;ctx.lineCap='round';ctx.beginPath();
    ctx.moveTo(cx+rx*.7,cy+ry*.3);ctx.quadraticCurveTo(cx+rx*1.5,cy+ry*.5,cx+rx*1.25,cy-ry*.35);ctx.stroke()}
  // wings
  if(c.wings){ctx.fillStyle=shade(P.b,-.18);
    for(const dir of[-1,1]){ctx.beginPath();ctx.moveTo(cx+dir*rx*.5,cy-ry*.25);
      ctx.quadraticCurveTo(cx+dir*rx*1.7,cy-ry*1.0,cx+dir*rx*1.45,cy+ry*.15);
      ctx.quadraticCurveTo(cx+dir*rx*1.0,cy+ry*.05,cx+dir*rx*.5,cy+ry*.1);ctx.closePath();ctx.fill()}}
  // horns / ears
  if(c.horns){ctx.fillStyle=shade(P.l,-.05);
    const hs=c.hornStyle;
    for(const dir of[-1,1]){const hx=cx+dir*rx*.45,hy=cy-ry*.85;
      ctx.beginPath();
      if(hs==='spike'){ctx.moveTo(hx-s*.08,hy);ctx.lineTo(hx+dir*s*.06,hy-s*.42);ctx.lineTo(hx+s*.12,hy-s*.05)}
      else if(hs==='curved'){ctx.quadraticCurveTo(hx+dir*s*.3,hy-s*.3,hx+dir*s*.12,hy-s*.5);ctx.quadraticCurveTo(hx+dir*s*.05,hy-s*.2,hx-s*.06,hy)}
      else if(hs==='antenna'){ctx.lineWidth=s*.05;ctx.strokeStyle=shade(P.l,-.05);ctx.moveTo(hx,hy);ctx.lineTo(hx+dir*s*.12,hy-s*.4);ctx.stroke();
        ctx.beginPath();ctx.arc(hx+dir*s*.12,hy-s*.44,s*.07,0,7);ctx.fill();ctx.beginPath()}
      else {for(let k=0;k<3;k++){ctx.moveTo(hx+dir*k*s*.09,hy);ctx.lineTo(hx+dir*k*s*.09+s*.03,hy-s*.16-k*s*.03);ctx.lineTo(hx+dir*k*s*.09+s*.09,hy)}}
      if(hs!=='antenna')ctx.fill();
    }}
  if(c.ears&&c.earStyle!=='fin'){ctx.fillStyle=shade(P.b,-.1);
    for(const dir of[-1,1]){const ex=cx+dir*rx*.75,ey=cy-ry*.55;ctx.beginPath();
      if(c.earStyle==='pointy'){ctx.moveTo(ex,ey);ctx.lineTo(ex+dir*s*.18,ey-s*.3);ctx.lineTo(ex+dir*s*.22,ey+s*.05)}
      else ctx.arc(ex,ey,s*.14,0,7);
      ctx.fill()}}
  // body
  const grad=ctx.createRadialGradient(cx-rx*.35,cy-ry*.45,rx*.15,cx,cy,ry*1.5);
  if(fig){grad.addColorStop(0,shade(P.b,.22));grad.addColorStop(.55,P.b);grad.addColorStop(1,shade(P.d,-.12))}
  else{grad.addColorStop(0,shade(P.b,.16));grad.addColorStop(1,P.b)}
  bodyPath(ctx,c,cx,cy,rx,ry);ctx.fillStyle=grad;ctx.fill();
  ctx.save();ctx.clip();
  // pattern
  const pr=mulberry32(c.seed^0x51ed);
  ctx.globalAlpha=fig?.35:.5;
  if(c.pattern==='spots'){ctx.fillStyle=shade(P.d,-.05);for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(cx+rf(pr,-1,1)*rx,cy+rf(pr,-1,1)*ry,s*rf(pr,.04,.09),0,7);ctx.fill()}}
  else if(c.pattern==='stripes'){ctx.strokeStyle=shade(P.d,-.05);ctx.lineWidth=s*.07;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(cx-rx*1.2,cy+i*ry*.28);ctx.quadraticCurveTo(cx,cy+i*ry*.28+s*.12,cx+rx*1.2,cy+i*ry*.28);ctx.stroke()}}
  else if(c.pattern==='scales'){ctx.strokeStyle=shade(P.l,-.02);ctx.lineWidth=s*.03;for(let yy=-4;yy<=4;yy++)for(let xx=-4;xx<=4;xx++){ctx.beginPath();ctx.arc(cx+xx*rx*.32+(yy%2?rx*.16:0),cy+yy*ry*.26,rx*.16,0,Math.PI);ctx.stroke()}}
  else if(c.pattern==='stars'){ctx.fillStyle=shade(P.l,.1);for(let i=0;i<7;i++){star(ctx,cx+rf(pr,-1,1)*rx,cy+rf(pr,-1,1)*ry,s*.05,s*.02,4);ctx.fill()}}
  ctx.globalAlpha=1;
  // belly
  if(c.belly){ctx.fillStyle=c.bellyCol||(fig?shade(P.l,-.08):shade(P.l,-.02));ctx.globalAlpha=fig?.9:.85;
    ctx.beginPath();ctx.ellipse(cx,cy+ry*.32,rx*.52,ry*.42,0,0,7);ctx.fill();ctx.globalAlpha=1}
  // figurine shading: bottom AO + top-left specular
  if(fig){
    const ao=ctx.createLinearGradient(0,cy-ry,0,cy+ry);
    ao.addColorStop(0,'rgba(255,255,255,0)');ao.addColorStop(1,'rgba(0,0,20,.38)');
    bodyPath(ctx,c,cx,cy,rx,ry);ctx.fillStyle=ao;ctx.fill();
    ctx.globalAlpha=.5;ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.ellipse(cx-rx*.38,cy-ry*.5,rx*.22,ry*.1,-.5,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  ctx.restore();
  // outline
  bodyPath(ctx,c,cx,cy,rx,ry);ctx.lineWidth=fig?s*.035:s*.045;ctx.strokeStyle=fig?shade(P.d,-.22):shade(P.d,-.1);ctx.stroke();
  // face
  const ey=cy-ry*.12,exs=rx*.42;
  const eyeXs=c.eyes===1?[0]:c.eyes===2?[-exs,exs]:c.eyes===3?[-exs,0,exs]:[-exs,-exs*.35,exs*.35,exs];
  const er=s*.11*(c.eyes>=3?.8:1);
  for(const exo of eyeXs){
    const ex=cx+exo;
    if(c.eyeStyle==='star'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,er*1.25,0,7);ctx.fill();ctx.fillStyle=P.d;star(ctx,ex,ey,er,er*.45);ctx.fill()}
    else if(c.eyeStyle==='glow'){const g=ctx.createRadialGradient(ex,ey,0,ex,ey,er*2);g.addColorStop(0,'#fff');g.addColorStop(.4,P.l);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ex,ey,er*2,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,er*.55,0,7);ctx.fill()}
    else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,er,0,7);ctx.fill();
      ctx.fillStyle='#1c1226';
      if(c.eyeStyle==='sleepy'){ctx.beginPath();ctx.arc(ex,ey+er*.35,er*.55,0,7);ctx.fill();ctx.strokeStyle='#1c1226';ctx.lineWidth=er*.4;ctx.beginPath();ctx.moveTo(ex-er,ey-er*.2);ctx.quadraticCurveTo(ex,ey-er*.7,ex+er,ey-er*.2);ctx.stroke()}
      else if(c.eyeStyle==='sharp'){ctx.beginPath();ctx.ellipse(ex+ (exo<0?-er*.2:er*.2),ey,er*.55,er*.75,exo<0?-.3:.3,0,7);ctx.fill()}
      else{ctx.beginPath();ctx.arc(ex+er*.15,ey+er*.1,er*.5,0,7);ctx.fill()}
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+er*.3,ey-er*.25,er*.18,0,7);ctx.fill()}
  }
  if(c.brow){ctx.strokeStyle=shade(P.d,-.2);ctx.lineWidth=s*.035;ctx.lineCap='round';
    for(const exo of eyeXs.slice(0,2)){ctx.beginPath();ctx.moveTo(cx+exo-s*.09,ey-s*.2);ctx.lineTo(cx+exo+s*.09,ey-s*.26);ctx.stroke()}}
  // mouth
  const my=cy+ry*.3;ctx.strokeStyle='#1c1226';ctx.lineWidth=s*.04;ctx.lineCap='round';
  ctx.beginPath();
  if(c.mouth==='smile')ctx.arc(cx,my-s*.03,s*.12,.15*Math.PI,.85*Math.PI);
  else if(c.mouth==='fang'){ctx.arc(cx,my-s*.02,s*.13,.1*Math.PI,.9*Math.PI);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(cx-s*.07,my+s*.05);ctx.lineTo(cx-s*.03,my+s*.13);ctx.lineTo(cx+s*.01,my+s*.05);ctx.moveTo(cx+s*.03,my+s*.05);ctx.lineTo(cx+s*.07,my+s*.13);ctx.lineTo(cx+s*.11,my+s*.05);ctx.fill();ctx.beginPath()}
  else if(c.mouth==='oo'){ctx.fillStyle='#1c1226';ctx.beginPath();ctx.arc(cx,my,s*.07,0,7);ctx.fill();ctx.beginPath()}
  else if(c.mouth==='zig'){ctx.moveTo(cx-s*.12,my);for(let i=0;i<4;i++)ctx.lineTo(cx-s*.12+(i+1)*s*.06,my+(i%2?s*.05:-s*.02))}
  else{ctx.moveTo(cx-s*.1,my);ctx.quadraticCurveTo(cx-s*.05,my+s*.08,cx,my);ctx.quadraticCurveTo(cx+s*.05,my+s*.08,cx+s*.1,my)}
  ctx.stroke();
}

// ============================== PRODUCT VARIANTS ==============================
// Card versions: normal, alt (alt art), gold, rainbow, voxel
const VARIANTS=['normal','alt','gold','rainbow','voxel'];
const VARIANT_LABEL={normal:'Normal',alt:'Alt Art',gold:'Gold',rainbow:'Rainbow',voxel:'Voxel'};
const VARIANT_MULT={normal:1,alt:1.6,gold:2.6,rainbow:2.2,voxel:1.4};
const VARIANT_EMOJI={normal:'▫️',alt:'🎨',gold:'🟡',rainbow:'🌈',voxel:'🧊'};

// ============================== SCENES (art windows) ==============================
function drawScene(ctx,element,w,h,seed,alt){
  const P=PALETTES.find(p=>p.n===element)||pick(mulberry32(seed),PALETTES);
  const r=mulberry32(seed^(alt?0xabcdef:0x1234));
  const g=ctx.createLinearGradient(0,0,alt?w:0,alt?0:h);
  g.addColorStop(0,shade(P.d,alt?.12:-.18));g.addColorStop(1,shade(P.d,-.42));
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const dot=(x,y,rad,col,a)=>{ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill();ctx.globalAlpha=1};
  if(element==='Ember'){for(let i=0;i<26;i++)dot(rf(r,0,w),rf(r,0,h),rf(r,1,3.5),pick(r,[P.l,'#ff9a3c','#ff5722']),rf(r,.25,.8));const gg=ctx.createRadialGradient(w/2,h*1.1,10,w/2,h*1.1,h*.9);gg.addColorStop(0,'rgba(255,150,50,.5)');gg.addColorStop(1,'rgba(255,150,50,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,w,h)}
  else if(element==='Tide'){ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;for(let i=0;i<4;i++){ctx.beginPath();for(let x=0;x<=w;x+=8)ctx.lineTo(x,h*.25+i*h*.18+Math.sin(x*.045+i+seed)*7);ctx.stroke()}for(let i=0;i<18;i++)dot(rf(r,0,w),rf(r,0,h),rf(r,1.5,5),'rgba(255,255,255,.7)',rf(r,.15,.5))}
  else if(element==='Verdant'){ctx.fillStyle='rgba(20,60,25,.55)';for(let i=0;i<12;i++){const x=rf(r,0,w),y=rf(r,0,h);ctx.save();ctx.translate(x,y);ctx.rotate(rf(r,0,7));ctx.beginPath();ctx.ellipse(0,0,rf(r,8,22),rf(r,4,8),0,0,7);ctx.fill();ctx.restore()}const gg=ctx.createLinearGradient(0,0,w,h);gg.addColorStop(0,'rgba(180,255,140,.25)');gg.addColorStop(.5,'rgba(180,255,140,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,w,h)}
  else if(element==='Storm'){ctx.fillStyle='rgba(255,255,255,.14)';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(rf(r,0,w),rf(r,0,h*.4),rf(r,30,70),rf(r,10,20),0,0,7);ctx.fill()}ctx.strokeStyle=P.l;ctx.lineWidth=3;ctx.shadowColor=P.l;ctx.shadowBlur=12;ctx.beginPath();let bx=rf(r,w*.2,w*.8),by=0;ctx.moveTo(bx,by);while(by<h*.75){bx+=rf(r,-28,28);by+=rf(r,18,42);ctx.lineTo(bx,by)}ctx.stroke();ctx.shadowBlur=0}
  else if(element==='Void'){for(let i=0;i<40;i++)dot(rf(r,0,w),rf(r,0,h),rf(r,.5,2),'#ffffff',rf(r,.2,.9));for(let i=0;i<3;i++){const gg=ctx.createRadialGradient(rf(r,0,w),rf(r,0,h),5,0,0,0);const gx=rf(r,0,w),gy=rf(r,0,h);const g2=ctx.createRadialGradient(gx,gy,4,gx,gy,rf(r,50,110));g2.addColorStop(0,shade(P.b,-.05));g2.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=.4;ctx.fillStyle=g2;ctx.fillRect(0,0,w,h);ctx.globalAlpha=1}}
  else if(element==='Lumen'){for(let i=0;i<9;i++){ctx.save();ctx.translate(w/2,-h*.15);ctx.rotate((i/9)*Math.PI-alt?.5:0);const gg=ctx.createLinearGradient(0,0,0,h*1.4);gg.addColorStop(0,'rgba(255,240,170,.4)');gg.addColorStop(1,'rgba(255,240,170,0)');ctx.fillStyle=gg;ctx.fillRect(-14,0,28,h*1.4);ctx.restore()}for(let i=0;i<14;i++)dot(rf(r,0,w),rf(r,0,h),rf(r,1,3),'#fff8d0',rf(r,.3,.9))}
  else if(element==='Terra'){ctx.fillStyle='rgba(0,0,0,.35)';for(let i=0;i<7;i++){const x=rf(r,0,w),bw=rf(r,30,80);ctx.beginPath();ctx.moveTo(x,h);ctx.lineTo(x+bw*.5,rf(r,h*.35,h*.75));ctx.lineTo(x+bw,h);ctx.fill()}for(let i=0;i<10;i++)dot(rf(r,0,w),rf(r,0,h),rf(r,1,2.5),P.l,rf(r,.2,.6))}
  else if(element==='Frost'){for(let i=0;i<30;i++){const x=rf(r,0,w),y=rf(r,0,h),s2=rf(r,2,6);ctx.strokeStyle='rgba(255,255,255,'+rf(r,.25,.8)+')';ctx.lineWidth=1;for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(x-s2,y);ctx.lineTo(x+s2,y);ctx.moveTo(x,y-s2);ctx.lineTo(x,y+s2);ctx.moveTo(x-s2*.7,y-s2*.7);ctx.lineTo(x+s2*.7,y+s2*.7);ctx.moveTo(x-s2*.7,y+s2*.7);ctx.lineTo(x+s2*.7,y-s2*.7);ctx.stroke()}}}
  if(alt){ctx.fillStyle='rgba(10,4,24,.28)';ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 13px system-ui';ctx.save();
    ctx.translate(w-56,22);ctx.rotate(-.12);ctx.strokeStyle='#ff5da2';ctx.lineWidth=2;ctx.strokeRect(-44,-14,88,22);ctx.fillText('ALT ART',-32,-2);ctx.restore()}
}

// ============================== OFFSCREEN HELPERS ==============================
function offCanvas(w,h){const cv=document.createElement('canvas');cv.width=w;cv.height=h;return cv}
function creatureLayer(c,w,h,s,cx,cy,fig){
  const cv=offCanvas(w,h),ctx=cv.getContext('2d');
  drawCreature(ctx,c,cx,cy,s,{fig});
  return cv;
}
function tintLayer(cv,color,alpha){
  const ctx=cv.getContext('2d');ctx.globalCompositeOperation='source-atop';
  const g=ctx.createLinearGradient(0,0,0,cv.height);
  g.addColorStop(0,shade(color,.25));g.addColorStop(1,shade(color,-.2));
  ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  return cv;
}
function pixelate(cv,factor){
  const small=offCanvas(Math.max(2,Math.round(cv.width/factor)),Math.max(2,Math.round(cv.height/factor)));
  const sctx=small.getContext('2d');sctx.imageSmoothingEnabled=true;sctx.drawImage(cv,0,0,small.width,small.height);
  const out=offCanvas(cv.width,cv.height);const octx=out.getContext('2d');
  octx.imageSmoothingEnabled=false;octx.drawImage(small,0,0,out.width,out.height);
  return out;
}
function holoOverlay(ctx,w,h,alpha){
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=alpha;
  const g=ctx.createLinearGradient(0,0,w,h);
  const bands=['#ff004c','#ff8a00','#eaff00','#00ff6a','#00c8ff','#8a2be2','#ff00c8'];
  bands.forEach((c,i)=>g.addColorStop(i/(bands.length-1),c));
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.globalCompositeOperation='screen';ctx.globalAlpha=alpha*.5;
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);

function describeTraits(text){
  const t=(text||'').toLowerCase();
  const traits={};let preset=null,presetName=null;
  let presetObj=null;
  for(const p of CHAR_PRESETS){if(p.kw.some(k=>t.includes(k))){preset=p.label;presetObj=p;presetName=p.name;Object.assign(traits,p.traits);break}}
  if(presetObj){for(const[cw,hex]of Object.entries(COLOR_WORDS)){if(new RegExp('\\b'+cw+'\\b').test(t)){if(traits.blocky)traits.blocky=Object.assign({},traits.blocky,{shirt:hex});else traits.pal=makePal(cw,hex);break}}}
  const setNm=t.match(/\b(?:set|collection|box|series|expansion|tcg|game)\s+(?:is\s+|are\s+)?(?:called|named)\s+([a-z][a-z'\- ]{1,24})/)
    ||t.match(/\b(?:called|named)\s+(?:the\s+)?(?:set|collection|box|series|expansion)\s+([a-z][a-z'\- ]{1,24})/)
    ||t.match(/\b(?:call|name)\s+(?:the\s+)?(?:set|collection|game|tcg)\s+([a-z][a-z'\- ]{1,24})/);
  const setCalled=setNm?titleWords(setNm[1].trim().replace(/\s+(the|who|that|from|with|and)\b.*$/,'')):null;
  const m=setCalled?null:t.match(/\b(?:called|named)\s+([a-z][a-z'\- ]{1,24})/);
  const name=m?titleWords(m[1].trim().replace(/\s+(the|who|that|from|with|and)\b.*$/,'')):null;
  if(!preset){
    for(const[cw,hex]of Object.entries(COLOR_WORDS)){if(new RegExp('\\b'+cw+'\\b').test(t)){traits.pal=makePal(cw,hex);break}}
    if(/\b(blob|blobby|goo)\b/.test(t))traits.bodyType='blob';
    else if(/\b(tall|thin|skinny)\b/.test(t))traits.bodyType='tall';
    else if(/\b(round|circle)\b/.test(t))traits.bodyType='round';
    else if(/\b(wide|fat|chunky|square|blocky)\b/.test(t))traits.bodyType='wide';
    if(/\bone[ -]eye|cyclops/.test(t))traits.eyes=1;
    else if(/\bthree[ -]eye/.test(t))traits.eyes=3;
    else if(/\bfour[ -]eye/.test(t))traits.eyes=4;
    if(/\bsleep/.test(t))traits.eyeStyle='sleepy';
    else if(/\b(angr|mean|sharp|fierce)/.test(t))traits.eyeStyle='sharp';
    else if(/\bstar[ -]eyes?/.test(t))traits.eyeStyle='star';
    else if(/\bglow(ing)?\b/.test(t))traits.eyeStyle='glow';
    if(/\bfangs?\b/.test(t))traits.mouth='fang';
    else if(/\b(smil|happy)\b/.test(t))traits.mouth='smile';
    else if(/\b(surprised|shocked|open mouth)\b/.test(t))traits.mouth='oo';

    else if(/\bantenn(a|ae)\b/.test(t)){traits.horns=true;traits.hornStyle='antenna'}
    else if(/\bcrown\b/.test(t)){traits.horns=true;traits.hornStyle='crown'}
    if(/\bwings?\b/.test(t))traits.wings=true;
    if(/\btail\b/.test(t))traits.tail=true;
    if(/\b(spots?|spotted)\b/.test(t))traits.pattern='spots';
    else if(/\b(stripes?|striped)\b/.test(t))traits.pattern='stripes';

    if(S.mechanics.length)oracleSay(`Your ruleset, as logged:\n${S.mechanics.map((m,i)=>`${i+1}. ${m}`).join('\n')}\nEvery set I design respects these mechanics.`);
    else oracleSay('No mechanics logged yet. Tell me the rules — "the main mechanic is ..." or "you win by ..." — and I will tune every set to them.');
    return}
  const mechIntro=(/\b(mechanic|mechanics|gameplay|turn structure|win condition|rules? (are|is)|the rules)\b/.test(t)
    ||/\byou (play|win|summon|draw|attack|discard|sacrifice|start|mulligan|lose)\b|\beach (turn|player)\b|\bper turn\b|\bhand size\b|\bdeck size\b/.test(t))
    &&!/^(what|how|who|why|explain)\b/.test(t)
    &&!/\b(shop|cash|rent|customer|sponsor|grade|grading|inventory|machine|decor)\b/.test(t);
  if(mechIntro){oracleMechanics(text);return}
  if(/what (am i|did i) (describ|talk)|who (am i|are we) (talk|describ)|current character|what character/.test(t)){
    if(LAST_DESC)oracleSay(`You are describing: ${LAST_DESC.name?'"'+LAST_DESC.name+'"':'a character'} — "${LAST_DESC.text}". Locked traits: ${Object.keys(LAST_DESC.traits).join(', ')||'none yet'}. Say "make him blue" or "make it tall" to restyle, or "design the set".`);
    else oracleSay('Nothing yet — describe a character ("a blue sleepy blob called Lumyoryor") and I will lock in the look.');
    return}
  const modCmd=/\b(make|change|turn|paint|recolor|swap|switch)\b[^.?!]*\b(him|her|it|them|he|she)\b/.test(t);
  const tr=describeTraits(text);
  if(modCmd&&(Object.keys(tr.traits).length||tr.name)){
    if(!LAST_DESC){oracleSay('Who are we restyling? Describe the character first — e.g. "a tall green dragon called Fred".');return}
    Object.assign(LAST_DESC.traits,tr.traits);if(tr.name)LAST_DESC.name=tr.name;
    oracleSay(`Restyled — ${Object.keys(tr.traits).length?'applied: '+Object.keys(tr.traits).join(', '):'name updated'}. Redesigning...`);
    oracleDesign(LAST_DESC.text,LAST_DESC.traits,LAST_DESC.name);return}
  if(tr.preset||tr.name||Object.keys(tr.traits).length)LAST_DESC={text,traits:tr.traits,preset:tr.preset,name:tr.name};
  const designCmd=/\b(design|make|create|build|generate|draft|print)\b[^.?!]*\b(set|cards?|figures?|figurines?|tcg|expansion|collection|boosters?|packs?)\b/.test(t)
    ||/\bnew set\b|\bstarter set\b|\bset called\b/.test(t);
  const gameRef=/\b(my|the|this|our) (game|tcg|card game|trading card game)\b/.test(t)||/\bin my (game|tcg|world)\b/.test(t);
  const gameDesc=/\b(game|tcg)\b/.test(t)&&/\b(about|has|have|features?|includes?|uses?|contains?|called|works?)\b/.test(t);
  const loreIntro=(gameRef||gameDesc||/\bthe (lore|story|premise|concept|setting|world) (is|of)\b/.test(t)||/\b(it'?s about|it is about|takes place|set in a world)\b/.test(t))
    &&!/^(what|how|who|why)\b/.test(t)
    &&!/\b(shop|cash|rent|customer|sponsor|grade|grading|inventory|machine|decor)\b/.test(t);
  if(loreIntro){
    S.lore=text.trim();
    if(designCmd){oracleDesign(text);return}
    oracleLore(text);return}
  if(designCmd){PENDING=null;oracleDesign(text);return}
  if(/help|what can you|commands|how does (the )?game work/.test(t)){oracleHelp();return}
  if(/^(yes|yeah|yep|sure|ok|okay|go ahead|please do|do it)\b/.test(t)){
    if(PENDING){const p=PENDING;PENDING=null;oracleDesign(p);return}
    oracleSay('Yes to what, proprietor? I have proposals for sets, tournaments, drops and upgrades — name one.');return}
  if(/^(no|nope|nah|not now|later)\b/.test(t)){PENDING=null;oracleSay('Understood — shelving that idea. I will keep monitoring the floor.');return}
  if(/\b(grade|grading|slab)\b/.test(t)){oracleSay('Send any product to the Grading spot on your Phone tab. Higher grades (7–10) multiply what customers will pay — a 10 can triple the price. It costs a fee per item and results arrive next morning.');return}
  if(/\bsponsor/.test(t)){oracleSay('Sponsors text you on the Phone tab. A deal pays cash now but binds you to stock their favored tribe — read the terms before you sign.');return}
  if(/\bmarket\b|\bindex\b|\beconomy\b/.test(t)){oraclePrice();return}
  if(/\brent\b|\bbill\b|\bexpenses?\b/.test(t)){oracleSay(`Rent is ${fmt(PREP_RENT_BASE+S.day*10)} and it is collected when you close the day. Volume beats margin early — keep stock moving.`);return}
  if(/\bhype\b/.test(t)){oracleSay(`Hype is ${Math.round(S.hype)}/100. It rises with drops, tournaments and sales, and decays daily. Above 40, customers pay premium prices and a drop lands hard.`);return}
  if(/\b(rep|reputation|level|lvl)\b/.test(t)){oracleSay(`Rep is ${Math.round(S.rep)} (level ${lvlOf()}). Tournaments unlock at ${TOURNEY_REP}, release drops at ${DROP_REP}, duel sets at ${DUEL_REP}. Sales and events raise it.`);return}
  if(/\bduel\b/.test(t)){oracleSay(`Duel sets bundle two cards into one playable head-to-head product. They unlock at ${DUEL_REP} rep and sell at a premium to competitive customers.`);return}
  if(/\btourname|compete|league/.test(t)){oracleTourney();return}
  if(/\bdrop|release|launch/.test(t)){oracleDrop();return}
  if(/\bbuy|upgrade|decor|machine|build\b|hugo/.test(t)){oracleBuild();return}
  if(/\banaly|\bstatus\b|\breport\b|how (are|is) (we|things|the shop|business)|\bsales\b|\bsold\b/.test(t)){oracleAnalyze();return}
  if(/\bprice|pricing|expensive|cheap|cost too/.test(t)){oraclePrice();return}
  if(analyzeTheme(text).hits.length){oracleThemeChat(text);return}
  oracleFallback(text);
}
function morningInsight(){
  const tot=Object.values(S.sales.tribe).reduce((a,b)=>a+b,0);
  const top=Object.entries(S.sales.tribe).sort((a,b)=>b[1]-a[1])[0];
  const low=S.inv.filter(p=>p.stock===0&&p.sold>0);
  let msg=`Good morning, proprietor. Day ${S.day} briefing: `;
  const bits=[];
  if(top)bits.push(`${top[0]} fandom is ${Math.round(100*top[1]/tot)}% of your sales history — stock accordingly`);
  if(low.length)bits.push(`${low.length} line${low.length>1?'s':''} sold out yesterday (${low.slice(0,2).map(p=>p.name).join(', ')}) — reprint or lose that demand`);
  if(S.hype>40)bits.push(`hype is ${Math.round(S.hype)} — a drop right now would land hard`);
  if(S.rep>=10&&!S.tourney)bits.push('you can host a tournament in the Events tab');
  if(!bits.length)bits.push('no data yet — design a set and open the shop, I will start modeling');
  oracleSay(msg+bits.join('. ')+'.');
}

const WANT_TYPE={card:['Any cool cards?','Got fresh packs?','Show me your cards!','New sets in?'],
  fig:['Any figurines today?','I collect figures!','Got statues?','Display pieces?'],
  duel:['Got duel sets? Card AND figure!','Bundles! I need bundles!','Both. I want both.']};
function spawnCustomer(force){
  const r=Math.random;
  const invTribes=[...new Set(S.inv.filter(p=>p.stock>0).map(p=>p.tribe))];
  const tribe=(invTribes.length&&r()<.7)?pick(Math.random,invTribes):pick(Math.random,TRIBES);
  let want;
  const w=r();
  if(S.inv.some(p=>p.kind==='duel'&&p.stock>0)&&w<.18)want='duel';
  else if(w<.55)want='card';else want='fig';
  const c={
    creature:genCreature((Math.random()*1e9)|0,{tribe}),
    want,tribe,
    budget:(12+S.day*2+S.rep*1.2+Math.random()*22)*S.mods.budget,
    patience:5+((Math.random()*4)|0),
    dropFan:!!(force&&force.drop),
    el:null,dead:false,
  };
  let line=(force&&force.drop?'🔥 ':'')+pick(Math.random,WANT_TYPE[want==='duel'?'duel':want==='card'?'card':'fig']);
  if(want==='fig'&&S.inv.every(p=>p.kind!=='fig'))line='You only sell cards? Hmph.';
  const wa=$('walkArea');
  if(T.ready){
    const m=monsterMesh(c.creature);
    m.position.set(7.2,0,4.4);
    T.scene.add(m);c.mesh=m;
    const b=document.createElement('div');b.className='bubble3d';b.textContent=line;
    wa.appendChild(b);c.bub=b;
    c.tx=rf(Math.random,-5.5,4);c.tz=rf(Math.random,-3,1.2);
    c.wander=setInterval(()=>{if(c.dead)return;c.tx=rf(Math.random,-5.5,4);c.tz=rf(Math.random,-3,1.2)},2600);
    S.customers.push(c);return c;
  }
  const d=document.createElement('div');d.className='customer';
  const cv=customerSprite(c.creature);d.appendChild(cv);
  const bub=document.createElement('div');bub.className='bubble';bub.textContent=line;
  d.appendChild(bub);
  const mood=document.createElement('div');mood.className='mood';mood.textContent='🤔';d.appendChild(mood);
  d.style.left=(8+Math.random()*(wa.clientWidth-110))+'px';
  d.style.opacity='0';
  wa.appendChild(d);
  requestAnimationFrame(()=>{d.style.opacity='1'});
  c.el=d;c.bub=bub;c.mood=mood;
  c.wander=setInterval(()=>{
    if(c.dead)return;
    d.style.left=clamp(parseFloat(d.style.left)+(Math.random()*120-60),4,wa.clientWidth-96)+'px';
  },2400);
  S.customers.push(c);
  return c;
}
function removeCustomer(c,happy){
  c.dead=true;clearInterval(c.wander);
  const moodTxt=happy?'😍':'😡';
  if(!happy)S.sales.todayAngry++;
  if(T.ready&&c.mesh){
    if(c.bub)c.bub.textContent=moodTxt;
    const m=c.mesh,b=c.bub;
    setTimeout(()=>{T.scene.remove(m);if(b)b.remove()},900);
  }else{
    c.mood.textContent=moodTxt;
    setTimeout(()=>{c.el.style.opacity='0';setTimeout(()=>c.el.remove(),600)},900);
  }
  S.customers=S.customers.filter(x=>x!==c);
}
function matchesWant(c,p){
  if(p.stock<=0)return false;
  if(c.want==='duel')return p.kind==='duel'||p.kind==='card'||p.kind==='fig';
  return p.kind===c.want;
}
function customerShop(c){
  const premium=S.drop&&S.drop.active?1.5:1;
  const fanMult=c.tribe===c.creature.tribe?1.35:1;
  const cands=S.inv.filter(p=>matchesWant(c,p)&&p.price<=c.budget*premium*(p.tribe===c.tribe?1.35:1));
  if(!cands.length)return false;
  cands.sort((a,b)=>(b.tribe===c.tribe?1:0)-(a.tribe===c.tribe?1:0)||b.price-a.price);
  const p=cands[0];
  p.stock--;p.sold++;S.cash+=Math.round(p.price*S.mods.price);
  S.sales.todayUnits++;S.sales.todayRev+=Math.round(p.price*S.mods.price);
  S.sales.types[p.kind]++;S.sales.tribe[p.tribe]=(S.sales.tribe[p.tribe]||0)+1;
  S.rep=clamp(S.rep+(p.tribe===c.tribe?.5:.25)*S.mods.rep,0,999);
  c.bub.textContent=pick(Math.random,['😍 MINE!','Take my money!','Worth every coin!','Adding to my binder!']);
  pushLog(`<b>Sold</b> ${p.name} (${VARIANT_LABEL[p.variant]}) → ${fmt(p.price)}`,'money');
  removeCustomer(c,true);
  renderAll();
  return true;
}

// main tick
let lastT=performance.now();
function tick(now){
  const dt=Math.max(0,Math.min(200,now-lastT))*S.speed;lastT=now;
  if(S.phase==='open'){
    S.openT+=dt;
    $('prog').style.width=clamp(100*S.openT/OPEN_LEN,0,100)+'%';
    S.spawnT-=dt;
    const interval=Math.max(900,3600/(1+S.rep*.03+S.hype*.012)/S.mods.spawn);
    if(S.spawnT<=0&&S.openT<OPEN_LEN-4000){S.spawnT=interval;spawnCustomer()}
    S.customers.slice().forEach(c=>{
      if(c.dead)return;
      c.patience-=dt/2600/S.mods.patience;
      if(c.patience<=0){
        const wasDropFan=c.dropFan&&S.drop&&S.drop.active;
        c.bub.textContent=wasDropFan?'Sold out?! RESTOCK!':'Hmph. Nothing for me.';
        if(wasDropFan){S.rep=clamp(S.rep-1,0,999);S.drop.missed=(S.drop.missed||0)+1}
        removeCustomer(c,false);
      }else if(Math.random()<dt/2400){customerShop(c)}
    });
    if(S.drop&&S.drop.active){
      const p=S.inv.find(x=>x.id===S.drop.productId);
      if(p&&p.stock===0&&!S.drop.done){
        S.drop.done=true;
        const missed=S.drop.missed||0;
        if(missed<=1){S.rep+=4;S.hype=clamp(S.hype+10,0,100);toast('✅ Drop SOLD OUT — rep +4')}
        else{S.rep=clamp(S.rep-2,0,999);toast('⚠ Drop sold out but '+missed+' fans were turned away')}
        pushLog(`<b>Drop complete</b> — ${p.name} sold out (${missed} turned away)`);
        S.drop=null;renderEvents();
      }
    }
    if(S.openT>=OPEN_LEN){
      S.customers.slice().forEach(c=>removeCustomer(c,false));
      if(S.drop)S.drop=null;
      closeDay();
    }
  }
  renderStats();
  requestAnimationFrame(tick);
}

function hostTournament(){
  if(S.rep<TOURNEY_REP){toast('Reputation '+TOURNEY_REP+' required');return}
  const cards=S.inv.filter(p=>p.kind==='card');
  if(cards.length<8){toast('Need 8+ distinct cards printed (you have '+cards.length+')');return}
  if(!spend(60,'tournament hosting'))return;
  S.cash+=120;pushLog('<b>Entry fees</b> +$120 (8 entrants)','money');
  const r=mulberry32((Math.random()*1e9)|0);
  let round=Array.from({length:8},()=>({name:genName(r,pick(r,TRIBES)),tribe:pick(r,TRIBES),power:rf(r,.4,1)}));
  const labels=['Quarterfinals','Semifinals','GRAND FINAL'];
  const lines=[];let ri=0;
  while(round.length>1){
    const nxt=[],m=[];
    for(let i=0;i<round.length;i+=2){
      const a=round[i],b=round[i+1];
      const win=(a.power*rf(r,.7,1.3)>b.power*rf(r,.7,1.3))?a:b;
      m.push(`${esc(a.name)} <small>(${a.tribe})</small> vs ${esc(b.name)} <small>(${b.tribe})</small> — <b>${esc(win.name)}</b> advances`);
      nxt.push(win);
    }
    lines.push({label:labels[ri]||'Final',m});round=nxt;ri++;
  }
  const champ=round[0];
  showModal(`<h2>🏆 Monster Masters Invitational</h2><div class="sub">Doors packed. Bug-flavored popcorn sold out in minutes.</div><div class="tlog" id="tlog"></div><div id="tsum"></div><div class="modalBtns"><button class="primary" id="tdone">Done</button></div>`);
  $('tdone').onclick=closeModal;
  const log=$('tlog');let li=0,mi=0;
  const iv=setInterval(()=>{
    if(li>=lines.length){clearInterval(iv);
      $('tsum').innerHTML=`<div class="statgrid">
        <div class="cell"><small>Champion</small><div class="big" style="font-size:18px">${esc(champ.name)}</div></div>
        <div class="cell"><small>Reputation</small><div class="big">+6</div></div>
        <div class="cell"><small>Hype</small><div class="big">+22</div></div></div>
        <p style="color:var(--dim)">${champ.tribe} fandom demand is surging for 2 days!</p>`;
      S.rep+=6;S.hype=clamp(S.hype+22,0,100);S.boost={tribe:champ.tribe,days:2};
      pushLog(`<b>Tournament</b> — champion ${champ.name} (${champ.tribe}) · rep +6 · hype +22`);
      renderAll();return}
    const L=lines[li];
    if(mi===0){const h=document.createElement('div');h.className='hl';h.textContent='— '+L.label+' —';log.appendChild(h)}
    const d=document.createElement('div');d.innerHTML=L.m[mi];log.appendChild(d);log.scrollTop=1e9;
    mi++;if(mi>=L.m.length){li++;mi=0}
  },420);
}

function scheduleDrop(){
  const sel=$('dropSel'),mkt=$('mktSel');
  if(!sel||!sel.value){toast('You need stock on shelves to schedule a drop');return}
  const p=S.inv.find(x=>x.id===+sel.value);
  const cost=+mkt.value;
  const boost=cost===30?15:cost===60?30:55;
  if(!spend(cost,'drop marketing'))return;
  S.drop={productId:p.id,name:p.name,scheduled:true,day:S.day+1,hypeBoost:boost,active:false,missed:0};
  pushLog(`<b>Drop scheduled</b> — ${p.name} goes live next open phase (+${boost} hype)`);
  toast('🔥 Drop scheduled: '+p.name);
  renderEvents();
}

let CUR_SET=null;
function openSetModal(set){
  CUR_SET=set;
  let figMode=!!set.figProof;
  const cellsHTML=()=>CUR_SET.defs.map((d,i)=>{
    const pv=CUR_SET.variant||'normal';
    const face=figMode?renderFigFace(Object.assign({},d,{variant:pv})):renderCardFace(Object.assign({},d,{variant:pv}));
    return `<div class="pcardbox"><img src="${face.toDataURL()}">
      <div class="printctl"><select class="vsel" data-def="${i}">${VARIANTS.map(v=>`<option value="${v}" ${v===pv?'selected':''}>${VARIANT_EMOJI[v]} ${VARIANT_LABEL[v]}</option>`).join('')}</select>
      <button class="primary" data-print="${i}" data-q="2">×2</button>
      <button data-print="${i}" data-q="5">×5</button>
      <button data-fig="${i}" title="Sculpt one figurine">🗿×1</button></div></div>`;
  }).join('');
  showModal(`<h2>🧪 Set Proofs — ${esc(set.name)}</h2>
    <div class="sub">ORACLE's designs. Pick a version (Normal · Alt Art · Gold · Rainbow · Voxel) and print cards — or 🗿 sculpt 3D figurines. <button id="proofToggle">${figMode?'🃏 Show Cards':'🗿 Show Figures'}</button></div>
    <div id="setGrid">${cellsHTML()}</div>
    <div class="modalBtns"><button id="closeSet">Done</button></div>`);
  $('closeSet').onclick=closeModal;
  const rebind=()=>{
    $('modal').querySelectorAll('.printctl').forEach(ctl=>{
      const upd=()=>{
        const d=CUR_SET.defs[+ctl.querySelector('.vsel').dataset.def];
        const v=ctl.querySelector('.vsel').value;
        const unit=Math.round(basePriceOf({kind:'card',cost:d.cost,rarity:d.rarity,variant:v})*.4);
        ctl.querySelector('[data-q="2"]').textContent='×2 '+fmt(unit*2);
        ctl.querySelector('[data-q="5"]').textContent='×5 '+fmt(unit*5);
      };
      ctl.querySelector('.vsel').onchange=upd;upd();
    });
    $('modal').querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{
      const def=CUR_SET.defs[+b.dataset.print];
      const v=b.parentElement.querySelector('.vsel').value;
      const q=+b.dataset.q;
      const unit=Math.round(basePriceOf({kind:'card',cost:def.cost,rarity:def.rarity,variant:v})*.4);
      if(!spend(unit*q,`printing ${q}× ${def.name} (${VARIANT_LABEL[v]})`))return;
      addProduct(makeProduct('card',def,v,q));
      toast(`🖨 Printed ${q}× ${def.name} — ${VARIANT_LABEL[v]}`);
    });
    $('modal').querySelectorAll('[data-fig]').forEach(b=>b.onclick=()=>{
      const def=CUR_SET.defs[+b.dataset.fig];
      const v=b.parentElement.querySelector('.vsel').value;
      const unit=printUnit('fig',def,v);
      if(!spend(unit,`sculpting ${def.name} figurine (${VARIANT_LABEL[v]})`))return;
      addProduct(makeProduct('fig',def,v,1));
      toast(`🗿 Sculpted ${def.name} — ${VARIANT_LABEL[v]}`);
    });
  };
  rebind();
  $('proofToggle').onclick=()=>{figMode=!figMode;$('setGrid').innerHTML=cellsHTML();$('proofToggle').textContent=figMode?'🃏 Show Cards':'🗿 Show Figures';rebind()};
}
// ---------- inventory ----------
function printUnit(kind,src,variant){
  let m=kind==='fig'?S.mods.fig:S.mods.print;
  if(variant==='gold'||variant==='rainbow')m*=S.mods.fancy;
  if(variant==='alt'||variant==='voxel')m*=S.mods.alt;
  return Math.round(basePriceOf({kind,cost:src.cost,rarity:src.rarity,variant})*(kind==='fig'?.25:.4)*m);
}
function invRowHTML(p){
  const kindLbl=p.kind==='card'?'Card':p.kind==='fig'?'Figurine':'Duel Set';
  let acts='';
  if(p.kind==='card'){
    acts=`<select class="vsel">${VARIANTS.map(v=>`<option value="${v}" ${v===p.variant?'selected':''}>${VARIANT_EMOJI[v]} ${VARIANT_LABEL[v]}</option>`).join('')}</select>
      <button data-act="print" class="printBtn">🖨 ×2</button><button data-act="fig" class="figBtn">🧿 Fig</button>`;
  }else if(p.kind==='fig'){
    acts=`<button data-act="cast">🧿 ×2</button>`;
  }
  if(p.kind!=='duel'){
    const canB=S.rep>=DUEL_REP&&S.inv.some(x=>x.kind===(p.kind==='card'?'fig':'card')&&x.creature.seed===p.creature.seed&&x.stock>0);
    acts+=`<button data-act="bundle" ${canB?'':'disabled'} title="Bundle card + figurine into a Duel Set">⚔</button>`;
  }
  return `<div class="invRow" data-id="${p.id}">
    <img src="${p.img}"><div class="info"><b>${esc(p.name)}</b>
    <small>${RARITY[p.rarity].n} ${kindLbl} · ${VARIANT_LABEL[p.variant]} · ${p.tribe}/${p.element} · sold ${p.sold}</small></div>
    <div class="stk">×${p.stock}</div>
    <div class="pr"><button data-act="minus">−</button><input data-act="price" value="${p.price}"><button data-act="plus">+</button></div>
    ${acts}</div>`;
}
function updatePrintCosts(row,p){
  const vsel=row.querySelector('.vsel');if(!vsel)return;
  const v=vsel.value;
  const pb=row.querySelector('[data-act="print"]'),fb=row.querySelector('[data-act="fig"]');
  if(pb)pb.textContent=`🖨 ×2 ${fmt(printUnit('card',p,v)*2)}`;
  if(fb)fb.textContent=`🧿 ${fmt(printUnit('fig',p,v))}`;
}
function renderInv(){
  const el=$('invList');
  if(!S.inv.length){el.innerHTML='<h3>📦 Inventory</h3><p style="color:var(--dim)">Empty. Ask ORACLE to design a set, then print cards here — or sculpt figurines from any card. Duel Sets (cards + figures) unlock at rep '+DUEL_REP+'.</p>';return}
  el.innerHTML='<h3>📦 Inventory — set prices, reprint in any version, sculpt figures, bundle duels</h3>'+S.inv.map(invRowHTML).join('');
  el.querySelectorAll('.invRow').forEach(row=>{const p=S.inv.find(x=>x.id===+row.dataset.id);if(p)updatePrintCosts(row,p)});
}
function bundleDuel(p){
  if(S.rep<DUEL_REP){toast('Reputation '+DUEL_REP+' required for Duel Sets');return}
  const q=S.inv.find(x=>x.kind==='fig'&&x.creature.seed===p.creature.seed&&x.stock>0);
  if(!q){toast('Need a figurine of '+p.name+' in stock — sculpt one first');return}
  p.stock--;q.stock--;
  const d=makeProduct('duel',{creature:p.creature,name:p.name,rarity:Math.max(p.rarity,q.rarity),cost:p.cost,atk:p.atk,hp:p.hp,effect:p.effect,flavor:p.flavor,element:p.element,tribe:p.tribe,setName:p.setName},p.variant,1);
  d.price=Math.round((p.price+q.price)*1.2);
  addProduct(d);
  toast('⚔ Duel Set created: '+d.name);
}

function init(){
  const st=document.createElement('style');
  st.textContent='.printctl{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.printctl select{flex:1;font-size:11px;padding:3px 4px}.printctl button{padding:3px 8px;font-size:11px}.pcardbox{background:#1a1329;border:1px solid var(--line);border-radius:10px;padding:6px}.decor{position:absolute;pointer-events:none;z-index:1;user-select:none}';
  document.head.appendChild(st);
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  const sp={sp0:0,sp1:1,sp3:3};
  Object.keys(sp).forEach(id=>{$(id).onclick=()=>{S.speed=sp[id];document.querySelectorAll('#speedctrl button').forEach(x=>x.classList.toggle('on',x.id===id))}});
  $('openBtn').onclick=openShop;syncTop();
  $('enterBtn').onclick=()=>{$('intro').classList.add('off');tryStart3D()};
  $('uiBtn').onclick=()=>document.body.classList.toggle('noui');
  $('chatForm').onsubmit=e=>{e.preventDefault();const v=$('chatInput').value.trim();if(!v)return;$('chatInput').value='';userSay(v);oracleReply(v)};
  $('invList').addEventListener('click',e=>{
    const btn=e.target.closest('button');if(!btn)return;
    const row=e.target.closest('.invRow');if(!row)return;
    const p=S.inv.find(x=>x.id===+row.dataset.id);if(!p)return;
    const act=btn.dataset.act;
    const vsel=row.querySelector('.vsel');
    const v=vsel?vsel.value:p.variant;
    if(act==='minus')p.price=Math.max(1,p.price-1);
    else if(act==='plus')p.price++;
    else if(act==='print'){
      if(!spend(printUnit('card',p,v)*2,`printing 2× ${p.name} (${VARIANT_LABEL[v]})`))return;
      addProduct(makeProduct('card',p,v,2));
    }else if(act==='fig'){
      if(!spend(printUnit('fig',p,v),`sculpting ${p.name} figurine (${VARIANT_LABEL[v]})`))return;
      addProduct(makeProduct('fig',p,v,1));
    }else if(act==='cast'){
      if(!spend(printUnit('fig',p,p.variant)*2,`casting 2× ${p.name} figurine`))return;
      addProduct(makeProduct('fig',p,p.variant,2));
    }else if(act==='bundle')bundleDuel(p);
    renderAll();
  });
  $('invList').addEventListener('change',e=>{
    const row=e.target.closest('.invRow');if(!row)return;
    const p=S.inv.find(x=>x.id===+row.dataset.id);if(!p)return;
    if(e.target.dataset.act==='price')p.price=clamp(parseInt(e.target.value)||1,1,999);
    if(e.target.classList.contains('vsel'))updatePrintCosts(row,p);
    renderAll();
  });
  $('eventsPad').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='hostT')hostTournament();
    if(b.id==='schedDrop')scheduleDrop();
  });
  refreshChips();
  tryStart3D();
  setPhase('prep');renderAll();applyDecor();
  oracleSay('ORACLE online. I am your shop intelligence engine — I design TCGs (cards, figurines, or duel sets covering both), read your sales data, forecast demand, and call tournaments and release drops.\nWe start with $150 and empty shelves. Click "Design my starter set" below and I will architect your first set — then print it in Normal, Alt Art, Gold, Rainbow or Voxel.');
  requestAnimationFrame(tick);
}

  if(!spend(it.cost,it.name))return;

function rollMarket(){
  S.market={tribe:{},variant:{normal:1}};
  TRIBES.forEach(t=>S.market.tribe[t]=Math.round(rf(Math.random,.75,1.35)*100)/100);
  VARIANTS.forEach(v=>{if(v!=='normal')S.market.variant[v]=Math.round(rf(Math.random,.7,1.5)*100)/100});

function sendGrade(id){
  const p=S.inv.find(x=>x.id===id);
  if(!p||p.kind!=='card'||p.stock<1||p.grading)return;
  if(!spend(Math.round(15+p.price*.1),'grading '+p.name))return;
  p.stock--;p.grading={day:S.day+1};
  pushLog(`<b>Sent to grading</b> ${p.name} — back day ${S.day+1}`);
  renderAll();
}
function resolveGrading(){
  S.inv.forEach(p=>{
    if(p.grading&&S.day>=p.grading.day){
      let grade=p.rarity>=2?ri(Math.random,8,10):ri(Math.random,6,10);
      if(Math.random()<.08)grade=ri(Math.random,3,7);
      p.grade=grade;p.grading=null;
      p.price=Math.round(p.price*(grade===10?2.2:grade===9?1.7:grade===8?1.4:1.05));
      p.stock++;p.img=renderProductImage(p);
      pushLog(`<b>Graded!</b> ${p.name} — GRADE ${grade}/10, repriced ${fmt(p.price)}`,'money');
      toast('📱 Grading back: '+p.name+' → '+grade+'/10');
    }
  });
}
function makeSponsorOffer(){
  const kinds=[
    {name:'SlimeCo Ad Deal',text:'SlimeCo wants floor ad space. $45 now → +18 hype today.',cost:45,run(){S.hype=clamp(S.hype+18,0,100);toast('📣 SlimeCo ads live: +18 hype')}},
    {name:'Goblin Logistics',text:'Goblin Logistics will airdrop 2 free units of a random in-stock product. $30.',cost:30,run(){const ps=S.inv.filter(x=>x.stock>0);if(ps.length){const q=pick(Math.random,ps);q.stock+=2;toast('📦 +2 free '+q.name)}else toast('Nothing in stock to restock')}},
    {name:'Collector Whale',text:'A whale is in town. It buys your priciest in-stock item at +40% right now. Free money.',cost:0,run(){const p=S.inv.filter(x=>x.stock>0).sort((a,b)=>b.price-a.price)[0];if(p){p.stock--;const gain=Math.round(p.price*1.4);S.cash+=gain;S.sales.todayUnits++;S.sales.todayRev+=gain;S.sales.tribe[p.tribe]=(S.sales.tribe[p.tribe]||0)+1;toast('🐋 Whale bought '+p.name+' for '+fmt(gain))}else toast('Nothing in stock to sell')}},
    {name:'Monster Weekly',text:'Feature article on your shop: $35 → +3 reputation tomorrow morning.',cost:35,run(){S.pendingRep=(S.pendingRep||0)+3;toast('📰 Article scheduled for tomorrow')}}
  ];
  return pick(Math.random,kinds);
}
function startNextDay(){
  if(S.cash<0){gameOver();return}
  S.day++;
  S.sales={tribe:S.sales.tribe,types:{card:0,fig:0,duel:0},todayUnits:0,todayRev:0,todayAngry:0};
  rollMarket();resolveGrading();
  if(S.pendingRep){S.rep+=S.pendingRep;toast('📰 Monster Weekly feature ran: rep +'+S.pendingRep);S.pendingRep=0}
  S.sponsors=[];
  if(Math.random()<.55)S.sponsors.push(makeSponsorOffer());
  closeModal();setPhase('prep');renderAll();morningInsight();
  if(S.sponsors.length)setTimeout(()=>toast('📱 New sponsor text — check your Phone'),2200);
}
function renderPhone(){
  const el=$('phoneBody');if(!el)return;
  const m=S.market||{tribe:{},variant:{}};
  const hot=TRIBES.map(t=>({t,v:m.tribe[t]||1})).sort((a,b)=>b.v-a.v);
  const gradable=S.inv.filter(p=>p.kind==='card'&&p.stock>0&&!p.grading);
  const grading=S.inv.filter(p=>p.grading);
  el.innerHTML=`
  <h3>📈 MarketWatch — today's index</h3>
  <div class="eventCard"><p>${hot.map(h=>`${h.t} <b style="color:${h.v>=1?'var(--good)':'var(--bad)'}">${h.v.toFixed(2)}×</b>`).join(' · ')}</p>
  <p>Version premiums: ${VARIANTS.filter(v=>v!=='normal').map(v=>`${VARIANT_LABEL[v]} <b>${((m.variant||{})[v]||1).toFixed(2)}×</b>`).join(' · ')}</p>
  <p style="color:var(--dim)">ORACLE uses these indices when suggesting prices. High-index tribes = charge more today.</p></div>
  <h3>💎 GradeSpot — slab your cards</h3>
  <div class="eventCard"><p>Send a card to the lab (${fmt(15)} + 10% of value). It returns tomorrow with a 1–10 grade; 8+ multiplies price hard, 10s double it. Graded slabs shine on the shelf.</p>
  ${grading.map(p=>`<div class="invRow"><img src="${p.img}"><div class="info"><b>${esc(p.name)}</b><small>At the lab — back day ${p.grading.day}</small></div></div>`).join('')}
  ${gradable.length?gradable.map(p=>`<div class="invRow"><img src="${p.img}"><div class="info"><b>${esc(p.name)}</b><small>${fmt(p.price)} · stock ${p.stock}</small></div><button data-grade="${p.id}" class="primary">Grade (${fmt(Math.round(15+p.price*.1))})</button></div>`).join(''):'<p style="color:var(--dim)">No cards in stock to grade.</p>'}
  </div>
  <h3>💬 Messages — sponsors</h3>
  ${(S.sponsors&&S.sponsors.length)?S.sponsors.map((sp,i)=>`<div class="eventCard"><h4>📱 ${esc(sp.name)}</h4><p>${esc(sp.text)}</p><div class="row"><button class="primary" data-acc="${i}">Accept${sp.cost?' — '+fmt(sp.cost):''}</button><button data-dec="${i}">Decline</button></div></div>`).join(''):'<p style="color:var(--dim)">Inbox quiet. Sponsors text you as your reputation grows.</p>'}`;
  el.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>sendGrade(+b.dataset.grade));
  el.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{
    const sp=S.sponsors[+b.dataset.acc];if(!sp)return;
    if(sp.cost&&!spend(sp.cost,sp.name))return;
    sp.run();S.sponsors=S.sponsors.filter(x=>x!==sp);renderPhone();
  });
  el.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{
    const sp=S.sponsors[+b.dataset.dec];if(!sp)return;
    S.sponsors=S.sponsors.filter(x=>x!==sp);renderPhone();
  });
}
// ============================== 3D SHOP (three.js) ==============================
let T={ready:false};
function showViewBadge(is3d){
  const wa=$('walkArea');if(!wa)return;
  let b=$('viewBadge');
  if(!b){b=document.createElement('div');b.id='viewBadge';b.className='viewbadge';wa.appendChild(b)}
  b.textContent=is3d?'🧊 3D — drag to orbit · scroll to zoom':'2D fallback — 3D engine unavailable';
}
function tryStart3D(){
  if(T.ready)return;
  if(typeof THREE!=='undefined'){if(T.tried)return;T.tried=true;init3D();showViewBadge(T.ready);return}
  if(window.__threeFailed){showViewBadge(false);return}
  setTimeout(tryStart3D,800);
}
function init3D(){
  if(typeof THREE==='undefined'||T.ready)return;
  const wrap=$('walkArea');
  try{
    const renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(wrap.clientWidth,wrap.clientHeight);
    renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
    renderer.shadowMap.enabled=true;
    wrap.insertBefore(renderer.domElement,wrap.firstChild);
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x1c1430);
    scene.fog=new THREE.Fog(0x1c1430,16,38);
    const camera=new THREE.PerspectiveCamera(50,wrap.clientWidth/Math.max(1,wrap.clientHeight),.1,100);
    T={renderer,scene,camera,wrap,ready:true,yaw:.55,pitch:.4,dist:11.5,
       target:new THREE.Vector3(0,1.1,0),decorGroup:new THREE.Group(),shelfGroup:new THREE.Group(),shelfAnchors:[]};
    scene.add(T.decorGroup);scene.add(T.shelfGroup);
    buildShopGeometry();
    updateCam();
    let drag=false,lx=0,ly=0;
    renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
    window.addEventListener('pointerup',()=>drag=false);
    window.addEventListener('pointermove',e=>{if(!drag)return;T.yaw-=(e.clientX-lx)*.005;T.pitch=clamp(T.pitch+(e.clientY-ly)*.004,.12,1.15);lx=e.clientX;ly=e.clientY;updateCam()});
    renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();T.dist=clamp(T.dist+e.deltaY*.01,5,24);updateCam()},{passive:false});
    window.addEventListener('resize',()=>{if(!T.ready)return;T.renderer.setSize(T.wrap.clientWidth,T.wrap.clientHeight);T.camera.aspect=T.wrap.clientWidth/Math.max(1,T.wrap.clientHeight);T.camera.updateProjectionMatrix()});
    T.lastAnim=0;
    renderer.setAnimationLoop(anim3d);
    updateShelf3D(true);applyDecor();showViewBadge(true);
  }catch(err){T.ready=false;showViewBadge(false)}
}
function updateCam(){
  const{camera,target,yaw,pitch,dist}=T;
  camera.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(target);
}
function buildShopGeometry(){
  const s=T.scene;
  const fc=document.createElement('canvas');fc.width=fc.height=256;const fx=fc.getContext('2d');
  for(let y=0;y<256;y+=32){fx.fillStyle=y%64?'#33254a':'#3d2e58';fx.fillRect(0,y,256,32);fx.strokeStyle='#241a38';fx.strokeRect(0,y,256,32)}
  const ft=new THREE.CanvasTexture(fc);ft.wrapS=ft.wrapT=THREE.RepeatWrapping;ft.repeat.set(4,3);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,12),new THREE.MeshStandardMaterial({map:ft,roughness:.9}));
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;s.add(floor);
  const wallM=new THREE.MeshStandardMaterial({color:0x2b2140,roughness:.95});
  const back=new THREE.Mesh(new THREE.BoxGeometry(16.6,4.6,.3),wallM);back.position.set(0,2.3,-5.2);s.add(back);
  const left=new THREE.Mesh(new THREE.BoxGeometry(.3,4.6,12.6),wallM);left.position.set(-8.2,2.3,0);s.add(left);
  const strip=new THREE.Mesh(new THREE.BoxGeometry(16.6,.5,.36),new THREE.MeshStandardMaterial({color:0x4a3870,roughness:.8}));strip.position.set(0,.25,-5.18);s.add(strip);
  const counter=new THREE.Group();
  const cb=new THREE.Mesh(new THREE.BoxGeometry(3.6,1.05,1.1),new THREE.MeshStandardMaterial({color:0x5a3fd6,roughness:.55}));cb.position.y=.52;cb.castShadow=true;counter.add(cb);
  const ct=new THREE.Mesh(new THREE.BoxGeometry(3.8,.08,1.3),new THREE.MeshStandardMaterial({color:0x8a6cff,roughness:.3}));ct.position.y=1.09;counter.add(ct);
  counter.position.set(5.4,0,-3.2);s.add(counter);
  for(let i=0;i<3;i++){
    const unit=new THREE.Group();
    const fm=new THREE.MeshStandardMaterial({color:0x4a3870,roughness:.7});
    const backp=new THREE.Mesh(new THREE.BoxGeometry(3.4,3.1,.12),fm);backp.position.y=1.55;unit.add(backp);
    [.7,1.7,2.7].forEach(h=>{const sh=new THREE.Mesh(new THREE.BoxGeometry(3.4,.08,.85),fm);sh.position.y=h;unit.add(sh)});
    unit.position.set(-5.2+i*4.4,0,-4.6);s.add(unit);
    T.shelfAnchors.push(unit.position.clone());
  }
  const df=new THREE.Mesh(new THREE.BoxGeometry(.25,3.5,1.7),new THREE.MeshStandardMaterial({color:0x4a3870,roughness:.7}));df.position.set(8.05,1.75,4);s.add(df);
  s.add(new THREE.AmbientLight(0x6a5a9a,.9));
  const warm=new THREE.PointLight(0xffb37a,1,22);warm.position.set(3,3.6,-1);s.add(warm);
  const cool=new THREE.PointLight(0x8a6cff,.7,18);cool.position.set(-4,3.4,1);s.add(cool);
  const spot=new THREE.SpotLight(0xffe0b0,1.1,16,.65,.5);spot.position.set(0,4.2,-2);spot.target.position.set(0,0,-4.5);s.add(spot);s.add(spot.target);
  const dl=new THREE.PointLight(0xffd9a0,.8,9);dl.position.set(7.4,1.9,4);s.add(dl);
}
function monsterMesh(c){
  const P=c.pal,g=new THREE.Group();
  const std=(col,x={})=>new THREE.MeshStandardMaterial(Object.assign({color:col,roughness:.55},x));
  const matB=std(P.b),matD=std(P.d),matL=std(P.l);
  const dims={blob:[.95,.8,.9],tall:[.7,1.15,.7],round:[.85,.85,.85],wide:[1.15,.65,.9]}[c.bodyType];
  const bx=dims[0]*c.size,by=dims[1]*c.size,bz=dims[2]*c.size;
  const body=new THREE.Mesh(new THREE.SphereGeometry(1,26,20),matB);
  body.scale.set(bx,by,bz);body.position.y=by;body.castShadow=true;g.add(body);
  if(c.belly){const be=new THREE.Mesh(new THREE.SphereGeometry(1,18,14),matL);be.scale.set(bx*.58,by*.55,bz*.5);be.position.set(0,by*.72,bz*.52);g.add(be)}
  const eyeR=c.eyes>=3?.15:.21;
  const exs=c.eyes===1?[0]:c.eyes===2?[-.38,.38]:c.eyes===3?[-.42,0,.42]:[-.45,-.16,.16,.45];
  const eyeY=by*1.12,eyeZ=bz*.8;
  const white=std(0xffffff,{roughness:.25}),black=std(0x1c1226,{roughness:.3});
  const glowM=std(P.l,{emissive:new THREE.Color(P.l),emissiveIntensity:1.3});
  exs.forEach(o=>{
    if(c.eyeStyle==='glow'){const e=new THREE.Mesh(new THREE.SphereGeometry(eyeR*.65,12,10),glowM);e.position.set(o*bx,eyeY,eyeZ);g.add(e);return}
    const w=new THREE.Mesh(new THREE.SphereGeometry(eyeR,14,12),white);w.scale.set(1,1,.6);w.position.set(o*bx,eyeY,eyeZ);g.add(w);
    const pu=new THREE.Mesh(new THREE.SphereGeometry(eyeR*.45,10,8),black);pu.position.set(o*bx+(o<0?-.03:.03),eyeY,eyeZ+eyeR*.35);g.add(pu);
  });
  const black2=black;
  if(c.mouth==='oo'){const mo=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),black2);mo.position.set(0,by*.72,bz*.92);g.add(mo)}
  else{const mo=new THREE.Mesh(new THREE.TorusGeometry(.15,.03,8,14,Math.PI),black2);mo.position.set(0,by*.68,bz*.88);mo.rotation.z=Math.PI;g.add(mo);
    if(c.mouth==='fang'){[-1,1].forEach(d=>{const f=new THREE.Mesh(new THREE.ConeGeometry(.035,.1,6),white);f.position.set(d*.07,by*.6,bz*.9);f.rotation.x=Math.PI;g.add(f)})}}
  if(c.horns){
    const mk=(x,rot,h,rr2)=>{const cone=new THREE.Mesh(new THREE.ConeGeometry(rr2,h,10),matL);cone.position.set(x,by*1.85,0);cone.rotation.z=rot;g.add(cone)};
    if(c.hornStyle==='spike'){mk(-bx*.4,.35,.5,.09);mk(bx*.4,-.35,.5,.09)}
    else if(c.hornStyle==='curved'){mk(-bx*.45,.9,.55,.1);mk(bx*.45,-.9,.55,.1)}
    else if(c.hornStyle==='crown'){mk(-bx*.35,.2,.3,.07);mk(0,0,.42,.08);mk(bx*.35,-.2,.3,.07)}
    else{[-1,1].forEach(d=>{const st=new THREE.Mesh(new THREE.CylinderGeometry(.02,.03,.5,6),matL);st.position.set(d*bx*.4,by*1.9,0);st.rotation.z=d*.25;g.add(st);const tip=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),glowM);tip.position.set(d*bx*.4+d*.12,by*2.15,0);g.add(tip)})}
  }
  if(c.ears){[-1,1].forEach(d=>{const e=new THREE.Mesh(new THREE.ConeGeometry(.14,.42,8),matD);e.position.set(d*bx*.85,by*1.3,0);e.rotation.z=d*-1.1;g.add(e)})}
  if(c.wings){[-1,1].forEach(d=>{const w=new THREE.Mesh(new THREE.ConeGeometry(.35,1,4),matD);w.scale.set(1,1,.25);w.position.set(d*bx*.95,by*1.1,-bz*.55);w.rotation.z=d*2.2;g.add(w)})}
  if(c.tail){const t=new THREE.Mesh(new THREE.CylinderGeometry(.05,.09,.9,8),matD);t.position.set(bx*.85,by*.5,-bz*.4);t.rotation.z=-.8;g.add(t)}
  if(c.pattern==='spots'||c.pattern==='stars'){const pr=mulberry32(c.seed^0x77);for(let i=0;i<5;i++){const s2=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6),matD);const a=rf(pr,-1.1,1.1),h2=rf(pr,.4,1.5);s2.position.set(Math.sin(a)*bx*.85,h2,Math.cos(a)*bz*.85);g.add(s2)}}
  return g;
}
let lastShelfKey='';
function updateShelf3D(force){
  if(!T.ready)return;
  const key=S.inv.map(p=>p.id+':'+p.stock+':'+p.variant).join('|');
  if(!force&&key===lastShelfKey)return;lastShelfKey=key;
  while(T.shelfGroup.children.length)T.shelfGroup.remove(T.shelfGroup.children[0]);
  const slots=[];
  T.shelfAnchors.forEach(a=>{[.78,1.78,2.78].forEach(h=>{[-1.1,0,1.1].forEach(o=>slots.push([a.x+o,h,a.z+.5]))})});
  S.inv.slice(0,slots.length).forEach((p,i)=>{
    new THREE.TextureLoader().load(p.img,tex=>{
      const m=new THREE.Mesh(new THREE.PlaneGeometry(.8,1.12),new THREE.MeshBasicMaterial({map:tex}));
      m.position.set(slots[i][0],slots[i][1],slots[i][2]);
      T.shelfGroup.add(m);
    });
  });
}
function anim3d(tms){
  if(!T.ready)return;
  const t=tms*.001;
  const dt=Math.min(.05,t-(T.lastAnim||t));T.lastAnim=t;
  S.customers.forEach(c=>{
    if(!c.mesh)return;const m=c.mesh;
    const dx=c.tx-m.position.x,dz=c.tz-m.position.z,d=Math.hypot(dx,dz);
    if(d>.08){const sp=1.7*dt;m.position.x+=dx/d*sp;m.position.z+=dz/d*sp;m.rotation.y=Math.atan2(dx,dz)}
    m.position.y=Math.abs(Math.sin(t*6+(c.seed%10)))*.07;
    if(c.bub){
      const v=new THREE.Vector3(m.position.x,m.position.y+2.5,m.position.z).project(T.camera);
      c.bub.style.left=((v.x*.5+.5)*T.wrap.clientWidth)+'px';
      c.bub.style.top=((-v.y*.5+.5)*T.wrap.clientHeight)+'px';
    }
  });
  T.renderer.render(T.scene,T.camera);
}
init();
</script>
